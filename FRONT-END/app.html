<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TCG Hub</title>
    <link rel="stylesheet" href="app.css">
</head>

<body>

    <div class="app">

        <!-- Sidebar -->
        <aside class="sidebar">

            <div class="sidebar-logo">
                <h1>TCG HUB</h1>
            </div>

            <nav class="sidebar-menu">

                <a href="#" class="menu-item active">
                    <span>⌂</span>
                    HOME
                </a>

                <a href="cards.html" class="menu-item">
                    <span>♧</span>
                    CARDS
                </a>

                <a href="#" class="menu-item">
                    <span>▣</span>
                    DECKS
                </a>

                <a href="#" class="menu-item">
                    <span>♙</span>
                    PLAYERS
                </a>

                <a href="#" class="menu-item">
                    <span>↔</span>
                    TRADES
                </a>

                <a href="#" class="menu-item">
                    <span>☵</span>
                    CHAT
                </a>

                <div class="menu-divider"></div>

                <a href="#" class="menu-item">
                    <span>♡</span>
                    COLLECTION
                </a>

                <a href="#" class="menu-item">
                    <span>⌕</span>
                    WANTS
                </a>

            </nav>

            <div class="sidebar-bottom">

                <a href="#" class="menu-item">
                    <span>⚙</span>
                    PROFILE
                </a>

            </div>

        </aside>


        <!-- Main content -->
        <main class="main-content">

            <!-- Top bar -->
            <header class="top-bar">

                <div class="search-bar">

                    <div class="search-filter">
                        <span>ALL</span>
                        <span class="arrow">▼</span>
                    </div>

                    <div class="search-divider"></div>

                    <span class="search-icon">⌕</span>

                    <input
                        type="text"
                        placeholder="Search cards, players, decks..."
                    >

                </div>

                <div class="user-info">
                    <span>WELCOME, PLAYER</span>
                </div>

            </header>


            <!-- Page content -->
            <section class="content">

                <div class="welcome-box">

                    <h1>WELCOME TO TCG HUB</h1>

                    <p>
                        Discover cards, meet players,
                        build decks and find your next trade.
                    </p>

                </div>

            </section>

        </main>

    </div>

</body>
</html>
