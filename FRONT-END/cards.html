<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cards - TCG Hub</title>
    <link rel="stylesheet" href="cards.css">
</head>

<body>

<div class="app">

    <!-- Sidebar -->
    <aside class="sidebar">

        <div class="sidebar-logo">
            <h1>TCG HUB</h1>
        </div>

        <nav class="sidebar-menu">

            <a href="app.html" class="menu-item">
                <span>⌂</span>
                HOME
            </a>

            <a href="cards.html" class="menu-item active">
                <span>♧</span>
                CARDS
            </a>

            <a href="#" class="menu-item">
                <span>▣</span>
                DECKS
            </a>

            <a href="#" class="menu-item">
                <span>♙</span>
                PLAYERS
            </a>

            <a href="#" class="menu-item">
                <span>↔</span>
                TRADES
            </a>

            <a href="#" class="menu-item">
                <span>☵</span>
                CHAT
            </a>

            <div class="menu-divider"></div>

            <a href="#" class="menu-item">
                <span>♡</span>
                COLLECTION
            </a>

            <a href="#" class="menu-item">
                <span>⌕</span>
                WANTS
            </a>

        </nav>

        <div class="sidebar-bottom">

            <a href="#" class="menu-item">
                <span>⚙</span>
                PROFILE
            </a>

        </div>

    </aside>


    <!-- Main content -->
    <main class="main-content">

        <!-- Top bar -->
        <header class="top-bar">

            <div class="search-bar">

                <div class="search-filter">
                    <span>ALL</span>
                    <span class="arrow">▼</span>
                </div>

                <div class="search-divider"></div>

                <span class="search-icon">⌕</span>

                <input
                    type="text"
                    placeholder="Search cards, players, decks..."
                >

            </div>

            <div class="user-info">
                <span>WELCOME, PLAYER</span>
            </div>

        </header>


        <!-- Cards content -->
        <section class="content">

            <div class="cards-header">

                <h1>CARDS</h1>

                <p>
                    Search and discover cards for your collection.
                </p>

            </div>


            <!-- Card search -->
            <div class="cards-search">

                <span class="search-icon">⌕</span>

                <input
                    type="text"
                    placeholder="Search for a card..."
                >

            </div>


            <!-- Filters -->
            <div class="cards-filters">

                <button>GAME ▼</button>

                <button>SET ▼</button>

                <button>RARITY ▼</button>

                <button>COLOR ▼</button>

            </div>


            <!-- Cards grid -->
            <div class="cards-grid">

                <article class="card-item">

                    <div class="card-image">
                        <img src="./images/card-placeholder.webp" alt="Card">
                    </div>

                    <div class="card-info">
                        <h2>Card Name</h2>
                        <p>SET NAME</p>
                    </div>

                </article>


                <article class="card-item">

                    <div class="card-image">
                        <img src="./images/card-placeholder.webp" alt="Card">
                    </div>

                    <div class="card-info">
                        <h2>Card Name</h2>
                        <p>SET NAME</p>
                    </div>

                </article>


                <article class="card-item">

                    <div class="card-image">
                        <img src="./images/card-placeholder.webp" alt="Card">
                    </div>

                    <div class="card-info">
                        <h2>Card Name</h2>
                        <p>SET NAME</p>
                    </div>

                </article>


                <article class="card-item">

                    <div class="card-image">
                        <img src="./images/card-placeholder.webp" alt="Card">
                    </div>

                    <div class="card-info">
                        <h2>Card Name</h2>
                        <p>SET NAME</p>
                    </div>

                </article>

            </div>

        </section>

    </main>

</div>


</body>
</html>
