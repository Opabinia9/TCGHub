<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TCG Hub</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="card">

        <!-- Card header -->
        <div class="card-header">
            <span>WELCOME TO TCG HUB</span>
        </div>

        <!-- Card image -->
        <div class="card-image">
            <img src="./images/idea1.webp" alt="TCG Hub">
        </div>

        <!-- Search -->
        <div class="card-search">
            <input
                type="text"
                placeholder="Search cards, players, decks..."
            >
        </div>

        <!-- Card presentation -->
        <div class="card-text">
            <p>
                <strong>Find your next trade.</strong><br>
                Discover cards, meet players, build your collection,
                and find the cards you're looking for.<br>
                <strong>Trade. Connect. Play.</strong>
            </p>
        </div>

        <!-- Card actions -->
        <div class="card-actions">

            <p>NEW TO THE COMMUNITY?</p>
            <a href="create-account.html" id="create-account-button">CREATE ACCOUNT</a>

            <p>ALREADY A PLAYER?</p>
            <a href="login.html" id="login-button">LOG IN</a>

        </div>

    </main>

    <script src="script.js"></script>

</body>
</html>
