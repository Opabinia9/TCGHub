services:
  postgres:
    image: postgres
    container_name: tcghub_database_test
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:${POSTGRES_HOST_PORT}"
    volumes:
      - postgres_data_test:/var/lib/postgresql

volumes:
  postgres_data_test:
