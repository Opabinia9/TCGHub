services:
  postgres:
    image: postgres
    container_name: tcghub_database
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:${POSTGRES_HOST_PORT}"
    volumes:
      - postgres_data2:/var/lib/postgresql

volumes:
  # postgres_data:
  postgres_data2:
